<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Utilities Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #111827, #1f2937);
    }

    main {
      width: min(90vw, 34rem);
      padding: 2rem;
      text-align: center;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.35);
    }

    h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 7vw, 2.5rem); }

    #status {
      min-height: 1.5rem;
      margin: 0 0 1.5rem;
      color: #d1d5db;
    }

    button {
      width: 100%;
      min-height: 3.25rem;
      padding: 0.9rem 1.25rem;
      color: #111827;
      background: #60a5fa;
      border: 0;
      border-radius: 0.65rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #93c5fd; }
    button:focus-visible { outline: 3px solid #bfdbfe; outline-offset: 3px; }
    button:disabled { color: #9ca3af; background: #374151; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <h1>Utilities Dashboard</h1>
    <p id="status" role="status" aria-live="polite">Checking dashboard availability…</p>
    <button id="open-dashboard" type="button" disabled>Open SL RAT Dashboard</button>
  </main>

  <script>
    const statusText = document.getElementById("status");
    const openButton = document.getElementById("open-dashboard");

    function showUnavailable() {
      statusText.textContent = "Dashboard is currently unavailable.";
      openButton.disabled = true;
    }

    async function loadDashboard() {
      openButton.disabled = true;

      try {
        const response = await fetch("./public-url.json", {
          cache: "no-store",
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error("Unavailable");
        }

        const data = await response.json();
        const value = typeof data?.url === "string" ? data.url.trim() : "";

        let parsed;
        try {
          parsed = new URL(value);
        } catch {
          throw new Error("Invalid URL");
        }

        const validCloudflareTunnel = parsed.protocol === "https:" &&
          /^[a-z0-9-]+\.trycloudflare\.com$/i.test(parsed.hostname) &&
          parsed.pathname === "/" &&
          !parsed.search &&
          !parsed.hash;

        if (!validCloudflareTunnel) {
          throw new Error("Invalid URL");
        }

        openButton.addEventListener("click", () => {
          window.location.assign(`${parsed.origin}/slrat`);
        }, { once: true });
        openButton.disabled = false;
        statusText.textContent = "Dashboard is available.";
      } catch {
        showUnavailable();
      }
    }

    loadDashboard();
  </script>
</body>
</html>
